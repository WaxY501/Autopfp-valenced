name: Build AutoPFP plugin

# Run it from the Actions tab: "Build AutoPFP plugin" -> "Run workflow".
# It finds the newest AutoPFP-*source*.zip in the repo (root or updates/), unpacks it over
# plugins/autopfp, builds the plugin and publishes the ready-to-install zip as a Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest source zip
        run: |
          ZIP=$(ls -1 AutoPFP-*source*.zip updates/AutoPFP-*source*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            rm -rf plugins/autopfp
            unzip -o -q "$ZIP"
          else
            echo "No source zip found; building the repository as it is."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies (if the repo has any)
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps
          elif [ -f package.json ]; then npm install --legacy-peer-deps
          elif [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm install
          fi

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew packageAutopfpPlugin --stacktrace

      - name: Find the plugin zip
        id: find
        run: |
          ls -R build/dist || true
          FILES=$(ls -1 build/dist/*.zip 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "No plugin zip in build/dist"; exit 1; fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$FILES" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish as a Release (direct download, no extra zip around it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/dist/*.zip \
            --title "AutoPFP build ${{ github.run_number }}" \
            --notes "Download the .zip below and import it into Valenced."

      - name: Also keep it as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopfp-plugin
          path: build/dist/*.zip
          
