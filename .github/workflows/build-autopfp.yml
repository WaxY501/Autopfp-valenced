name: Build AutoPFP plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source ZIP (if present)
        run: |
          if [ -f autopfp-source.zip ]; then
            rm -rf plugins/autopfp
            unzip -oq autopfp-source.zip
          fi
          if [ ! -f plugins/autopfp/manifest.json ]; then
            echo "::error::plugins/autopfp/manifest.json is missing. Upload autopfp-source.zip to the repository root first."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build JavaScript
        run: |
          bun install
          bun run build autopfp
          ls -la plugins/autopfp/build/js

      - name: Install Android SDK platform
        run: |
          COMPILE=$(grep -oP 'compileSdk\s*=\s*"\K[0-9]+' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$COMPILE" || true

      - name: Build native part (Kotlin)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :plugins:autopfp:dexJar
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - name: Package plugin ZIP
        run: |
          mkdir pkg
          cp plugins/autopfp/manifest.json pkg/
          cp plugins/autopfp/build/js/index.js pkg/index.js
          cp plugins/autopfp/build/outputs/plugin/plugin.jar pkg/plugin.jar
          (cd pkg && zip -qr ../AutoPFP-Rotator.zip .)
          unzip -l AutoPFP-Rotator.zip

      - name: Save the plugin source in the repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/autopfp
          if git diff --cached --quiet; then
            echo "Source already up to date."
          else
            git commit -m "Sync AutoPFP plugin source"
            git push
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "autopfp-${{ github.run_number }}" AutoPFP-Rotator.zip \
            --title "AutoPFP Rotator build ${{ github.run_number }}" \
            --notes "Install AutoPFP-Rotator.zip in Valenced."
