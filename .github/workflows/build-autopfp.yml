name: Build AutoPFP plugin

# Run it from the Actions tab: "Build AutoPFP plugin" -> "Run workflow".
# It finds the newest AutoPFP-*source*.zip in the repo (root or updates/), unpacks it over
# plugins/autopfp, builds the plugin and publishes the ready-to-install zip as a Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest source zip
        run: |
          ZIP=$(ls -1 AutoPFP-*source*.zip updates/AutoPFP-*source*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            rm -rf plugins/autopfp
            unzip -o -q "$ZIP"
          else
            echo "No source zip found; building the repository as it is."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show what the repo contains (for debugging)
        run: |
          echo "--- repo root ---"; ls -la
          echo "--- package.json ---"; cat package.json 2>/dev/null || echo "(no package.json)"
          echo "--- gradle files ---"; ls -la gradlew settings.gradle* build.gradle* 2>&1 || true

      - name: Install JS dependencies (if the repo has any)
        run: |
          if [ -f package.json ]; then
            # npm cannot install Valenced's git packages on a clean machine: it compiles them in the
            # wrong order and fails. Fetch the same code as plain tarballs instead (no compile step
            # runs for those), then build the packages ourselves in the right order.
            cat > /tmp/tarballs.mjs <<'JS'
          import fs from 'fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const toTar = spec => {
            let m = /^(?:git\+)?https:\/\/github\.com\/([^/]+\/[^/#]+?)(?:\.git)?(?:#(.+))?$/.exec(spec)
            if (!m) m = /^github:([^#]+)(?:#(.+))?$/.exec(spec)
            return m ? `https://codeload.github.com/${m[1]}/tar.gz/${m[2] || 'HEAD'}` : null
          }
          const overrides = { ...(pkg.overrides || {}) }
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, spec] of Object.entries(pkg[section] || {})) {
              const tar = toTar(String(spec))
              if (tar) { pkg[section][name] = tar; overrides[name] = tar; console.log('tarball:', name, tar) }
            }
          }
          pkg.overrides = overrides
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          JS
            node /tmp/tarballs.mjs
            rm -f package-lock.json
            npm install --legacy-peer-deps --ignore-scripts
            for d in node_modules/@valenced/types node_modules/@valenced/plugin-cli; do
              if [ -d "$d" ]; then
                echo "Preparing $d"
                (cd "$d" && npm run prepare --if-present) || echo "prepare for $d reported errors; continuing"
              fi
            done
          fi

      - name: Build
        run: |
          if [ ! -f ./gradlew ]; then echo "ERROR: no gradlew in the repo root - the Gradle build files are missing from the repository."; exit 1; fi
          chmod +x ./gradlew
          ./gradlew packageAutopfpPlugin --stacktrace

      - name: Find the plugin zip
        id: find
        run: |
          ls -R build/dist || true
          FILES=$(ls -1 build/dist/*.zip 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "No plugin zip in build/dist"; exit 1; fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$FILES" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish as a Release (direct download, no extra zip around it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/dist/*.zip \
            --title "AutoPFP build ${{ github.run_number }}" \
            --notes "Download the .zip below and import it into Valenced."

      - name: Also keep it as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopfp-plugin
          path: build/dist/*.zip
          
