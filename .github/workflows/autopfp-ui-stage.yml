name: AutoPFP UI Stage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ui-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add AutoPFP settings interface
        shell: bash
        run: |
          mkdir -p plugins/autopfp/js

          cat > plugins/autopfp/js/settings.tsx <<'TSX'
          import React, { useEffect, useState } from 'react'
          import { Image, Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native'
          import { AutoPfpImageSearch, type SearchImage } from './imageSearch'

          type SavedCollection = { name: string; urls: string[] }
          const searcher = new AutoPfpImageSearch()
          const styles = StyleSheet.create({
            root: { padding: 16, gap: 12 }, title: { fontSize: 20, fontWeight: '700', color: '#fff' },
            sub: { color: '#aaa', fontSize: 12 }, row: { flexDirection: 'row', flexWrap: 'wrap', gap: 8, alignItems: 'center' },
            input: { backgroundColor: '#24262b', color: '#fff', padding: 10, borderRadius: 8, minWidth: 150, flexGrow: 1 },
            button: { backgroundColor: '#5865f2', paddingVertical: 9, paddingHorizontal: 12, borderRadius: 8 },
            buttonText: { color: '#fff', fontWeight: '600' }, card: { backgroundColor: '#202226', borderRadius: 10, padding: 10, gap: 8 },
            image: { width: 112, height: 112, borderRadius: 8, backgroundColor: '#303238' },
            small: { color: '#ddd', fontSize: 13 }, section: { color: '#fff', fontSize: 16, fontWeight: '600', marginTop: 4 },
            item: { flexDirection: 'row', gap: 10, alignItems: 'center', paddingVertical: 5 },
          })

          function Button({ label, onPress, muted = false }: { label: string; onPress: () => void; muted?: boolean }) {
            return <Pressable onPress={onPress} style={[styles.button, muted && { backgroundColor: '#484b52' }]}><Text style={styles.buttonText}>{label}</Text></Pressable>
          }

          export default function AutoPfpSettings() {
            const [query, setQuery] = useState('')
            const [manualUrl, setManualUrl] = useState('')
            const [results, setResults] = useState<SearchImage[]>([])
            const [images, setImages] = useState<string[]>([])
            const [collections, setCollections] = useState<SavedCollection[]>([])
            const [collectionName, setCollectionName] = useState('')
            const [intervalSec, setIntervalSec] = useState('30')
            const [running, setRunning] = useState(false)
            const [previewIndex, setPreviewIndex] = useState(0)
            const [cropMode, setCropMode] = useState<'cover' | 'contain'>('cover')
            const [squareSize, setSquareSize] = useState('512')
            const [quality, setQuality] = useState('92')
            const [busy, setBusy] = useState(false)
            const [status, setStatus] = useState('Gallery is session-only in this UI stage.')

            useEffect(() => {
              if (!running || images.length < 2) return
              const seconds = Math.max(10, Number(intervalSec) || 30)
              const timer = setInterval(() => setPreviewIndex(i => (i + 1) % images.length), seconds * 1000)
              return () => clearInterval(timer)
            }, [running, images, intervalSec])

            async function doSearch() {
              setBusy(true); setStatus('Searching Wikimedia Commons…')
              try { const found = await searcher.search(query, 24); setResults(found); setStatus(`${found.length} results loaded.`) }
              catch (e) { setStatus(e instanceof Error ? e.message : 'Search failed.') }
              finally { setBusy(false) }
            }
            function add(url: string) {
              if (!url || images.includes(url)) { setStatus('Already in gallery or empty URL.'); return }
              setImages(prev => [...prev, url]); setStatus('Image added to this session.'); setManualUrl('')
            }
            function saveCollection() {
              const name = collectionName.trim()
              if (!name || images.length === 0) { setStatus('Give the collection a name and add at least one image first.'); return }
              setCollections(prev => [...prev.filter(c => c.name !== name), { name, urls: [...images] }])
              setCollectionName(''); setStatus(`Saved “${name}” for this session.`)
            }
            function loadCollection(c: SavedCollection) { setImages([...c.urls]); setPreviewIndex(0); setRunning(false); setStatus(`Loaded “${c.name}”.`) }

            return <ScrollView contentContainerStyle={styles.root}>
              <Text style={styles.title}>AutoPFP Rotator</Text>
              <Text style={styles.sub}>Search, curate and preview your image rotation. This interface does not change your Discord avatar.</Text>
              <Text style={styles.section}>Image search</Text>
              <View style={styles.row}><TextInput style={styles.input} value={query} onChangeText={setQuery} placeholder="Search a theme or subject" placeholderTextColor="#999" /><Button label={busy ? 'Searching…' : 'Search'} onPress={doSearch} /></View>
              <Text style={styles.sub}>{status}</Text>
              <View style={styles.row}>{results.map((item, i) => <View style={styles.card} key={`${item.originalUrl}-${i}`}><Image source={{ uri: item.url }} style={styles.image} resizeMode="cover" /><Text style={styles.small} numberOfLines={2}>{item.title}</Text><Button label="Add" onPress={() => add(item.originalUrl)} /></View>)}</View>
              <Text style={styles.section}>Add image by URL</Text>
              <View style={styles.row}><TextInput style={styles.input} value={manualUrl} onChangeText={setManualUrl} placeholder="https://… image URL" placeholderTextColor="#999" autoCapitalize="none" /><Button label="Add URL" onPress={() => add(manualUrl.trim())} /></View>
              <Text style={styles.section}>Gallery ({images.length})</Text>
              {images.length === 0 ? <Text style={styles.sub}>Add images above to build a preview pool.</Text> : <View style={styles.row}>{images.map((url, i) => <View key={`${url}-${i}`} style={styles.card}><Image source={{ uri: url }} style={styles.image} resizeMode={cropMode} /><Text style={styles.small}>Image {i + 1}</Text><Button label="Remove" muted onPress={() => { setImages(prev => prev.filter((_, j) => j !== i)); setPreviewIndex(0); setRunning(false) }} /></View>)}</View>}
              <Text style={styles.section}>Preview rotation</Text>
              <View style={styles.row}><TextInput style={[styles.input, { minWidth: 90, flexGrow: 0 }]} value={intervalSec} onChangeText={setIntervalSec} keyboardType="numeric" placeholder="Seconds" placeholderTextColor="#999" /><Text style={styles.small}>seconds (minimum 10)</Text><Button label="Start preview" onPress={() => { if (images.length < 2) { setStatus('Add at least 2 images to preview rotation.'); return } setRunning(true); setStatus('Preview rotation running.') }} /><Button label="Stop" muted onPress={() => { setRunning(false); setStatus('Preview stopped.') }} /></View>
              {images.length > 0 && <View style={styles.card}><Image source={{ uri: images[Math.min(previewIndex, images.length - 1)] }} style={{ width: 240, height: 240, alignSelf: 'center', borderRadius: 12 }} resizeMode={cropMode} /><Text style={styles.small} >Preview {Math.min(previewIndex + 1, images.length)} / {images.length} · {running ? 'Playing' : 'Paused'}</Text><View style={styles.row}><Button label="Previous" muted onPress={() => setPreviewIndex(i => (i - 1 + images.length) % images.length)} /><Button label="Next" muted onPress={() => setPreviewIndex(i => (i + 1) % images.length)} /></View></View>}
              <Text style={styles.section}>Collections / themes</Text>
              <View style={styles.row}><TextInput style={styles.input} value={collectionName} onChangeText={setCollectionName} placeholder="Collection name" placeholderTextColor="#999" /><Button label="Save current gallery" onPress={saveCollection} /></View>
              {collections.map((c, i) => <View key={`${c.name}-${i}`} style={styles.row}><Text style={styles.small}>{c.name} · {c.urls.length} images</Text><Button label="Load" onPress={() => loadCollection(c)} /><Button label="Delete" muted onPress={() => setCollections(prev => prev.filter((_, j) => j !== i))} /></View>)}
              <Text style={styles.section}>Processing / preview settings</Text>
              <View style={styles.row}><Button label={cropMode === 'cover' ? 'Crop: Fill' : 'Crop: Fit'} muted onPress={() => setCropMode(m => m === 'cover' ? 'contain' : 'cover')} /><Text style={styles.small}>Preview mode: {cropMode}</Text></View>
              <View style={styles.row}><TextInput style={[styles.input, { minWidth: 80, flexGrow: 0 }]} value={squareSize} onChangeText={setSquareSize} keyboardType="numeric" /><Text style={styles.small}>target size (px)</Text><TextInput style={[styles.input, { minWidth: 80, flexGrow: 0 }]} value={quality} onChangeText={setQuality} keyboardType="numeric" /><Text style={styles.small}>quality (%)</Text></View>
              <Text style={styles.sub}>These are UI preferences only for now. Actual image processing, native file-picker import, persistent gallery/theme storage, and avatar updating are not connected in this stage.</Text>
            </ScrollView>
          }
          TSX


          cat > plugins/autopfp/js/index.ts <<'EOF'
          import AutoPfpSettings from './settings'
          import { AutoPfpCore } from './core'


          const autopfp = new AutoPfpCore()


          export default plugin({
            SettingsComponent: AutoPfpSettings,
            start() {
              console.log('[AutoPFP] Settings UI stage loaded')
              console.log('[AutoPFP] Rotation core ready:', autopfp.size)
            },
            stop() {
              autopfp.stopRotation()
              console.log('[AutoPFP] Plugin stopped')
            },
          })
          EOF

          cat > plugins/autopfp/README.md <<'EOF'
          # AutoPFP Rotator

          ## Implemented source modules
          - Rotation core and timer callback
          - Wikimedia Commons image search
          - Settings screen with image search results and previews
          - Add/remove images from a session gallery
          - Manual image URL entry
          - Preview rotation timer and manual previous/next
          - Session-only named collections/themes
          - Preview crop mode and size/quality preference fields

          ## Limitations in this stage
          - Session gallery and collections are in-memory only (not persistent).
          - Device file picker is not connected; add images through search or URL.
          - Processing fields are UI settings only; actual resize/compression is not wired into the settings screen.
          - Preview rotation only changes the displayed preview. It does not modify a Discord avatar.
          - Full plugin packaging/build validation requires the Valenced API dependencies and is not performed by this workflow.
          EOF

          git diff --check
          test -s plugins/autopfp/js/settings.tsx
          grep -q "SettingsComponent: AutoPfpSettings" plugins/autopfp/js/index.ts
          grep -q "export class AutoPfpImageSearch" plugins/autopfp/js/imageSearch.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/autopfp/js/index.ts plugins/autopfp/js/settings.tsx plugins/autopfp/README.md
          git diff --cached --quiet || git commit -m "Add AutoPFP settings and gallery preview UI"
          git push
